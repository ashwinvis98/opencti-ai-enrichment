name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Dockerfile runs, so the runtime version must stay
        # green. 3.12 is covered because that is a version the suite has actually
        # been run against by hand; pinning only one of the two would leave the
        # other unverified by anything.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately does NOT install requirements.txt. The suite stubs both
      # pycti and the Gemini SDK, makes no network calls and needs no
      # credentials, so running it without them is the proof of that claim
      # rather than just an assertion in the README.
      - name: Install test dependencies only
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not just the tip

      # Runs the gitleaks BINARY rather than gitleaks-action.
      #
      # The action infers a commit range from the push event, and on a push that
      # CREATES a branch the "before" SHA is all zeros, so the range is invalid and
      # it dies with `failed to scan Git repository error="stderr is not empty"` —
      # a failure about the event shape, not about the repository contents.
      #
      # Invoking the binary directly also means CI runs the identical command used
      # locally, so a green build here and a clean local scan mean the same thing.
      # Version pinned so a release cannot change the gate underneath us.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history for secrets
        run: gitleaks detect --redact --verbose
