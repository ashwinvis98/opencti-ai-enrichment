name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Dockerfile runs, so the runtime version must stay
        # green. 3.12 is covered because that is a version the suite has actually
        # been run against by hand; pinning only one of the two would leave the
        # other unverified by anything.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately does NOT install requirements.txt. The suite stubs both
      # pycti and the Gemini SDK, makes no network calls and needs no
      # credentials, so running it without them is the proof of that claim
      # rather than just an assertion in the README.
      - name: Install test dependencies only
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not just the tip

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
